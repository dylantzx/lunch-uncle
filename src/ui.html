<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1c4a3c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12261f" media="(prefers-color-scheme: dark)">
  <title>Lunch Uncle</title>
  <style>
    /* Tokens. Kopitiam palette: cup green, marble cream, kopi brown, chilli for errors only. */
    :root {
      --bg: #f6f1e7;
      --bg-outer: #e9e1d1;
      --surface: #fffdf8;
      --ink: #1f1a14;
      --muted: #645949;
      --line: #d9cdb6;
      --accent: #1c4a3c;
      --accent-ink: #ffffff;
      --sign: #1c4a3c;
      --sign-ink: #f8f0dc;
      --sign-muted: #c9dbd0;
      --tile: #f3e6c6;
      --tag: #8a4a0c;
      --danger: #9b2318;
      --danger-bg: #fcebe6;
      --danger-line: #e2a69c;
      --focus: #1c4a3c;

      --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem;
      --r-bubble: 1rem; --r-control: .625rem;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181511;
        --bg-outer: #0f0d0a;
        --surface: #242019;
        --ink: #f2eadc;
        --muted: #b5a995;
        --line: #40382d;
        --accent: #2f7a63;
        --accent-ink: #ffffff;
        --sign: #12261f;
        --sign-ink: #f2e8d0;
        --sign-muted: #a9c2b6;
        --tile: #cdbf9c;
        --tag: #e6b566;
        --danger: #ffa799;
        --danger-bg: #3a1b16;
        --danger-line: #7d3a30;
        --focus: #8fd6bc;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.45;
      color: var(--ink); background: var(--bg-outer);
      -webkit-text-size-adjust: 100%;
    }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    [hidden] { display: none !important; }

    .app {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; height: var(--app-h, 100dvh);
      max-width: 44rem; margin: 0 auto; background: var(--bg);
    }
    @media (min-width: 46rem) {
      .app { border-inline: 1px solid var(--line); }
    }

    /* Signboard header */
    .sign {
      flex: none; background: var(--sign); color: var(--sign-ink);
      padding: calc(var(--s3) + env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right)) var(--s3) max(var(--s4), env(safe-area-inset-left));
      display: flex; align-items: center; gap: var(--s3);
    }
    .sign svg.mark { flex: none; width: 2.25rem; height: 2.25rem; }
    .sign-text { flex: 1; min-width: 0; }
    .sign h1 {
      margin: 0; font-size: 1.125rem; line-height: 1.2; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .sign p { margin: 0; font-size: .8125rem; color: var(--sign-muted); }
    @media (max-width: 21.5rem) { .sign svg.mark { display: none; } }
    .sign :focus-visible { outline-color: var(--sign-ink); }
    .reset {
      flex: none; min-height: 2.75rem; padding: 0 var(--s3);
      background: transparent; color: var(--sign-ink);
      border: 1px solid var(--sign-muted); border-radius: var(--r-control);
      font-size: .875rem; font-weight: 600; white-space: nowrap;
    }
    .reset:hover { background: rgba(255, 255, 255, .1); }
    .reset.confirm { background: var(--sign-ink); color: var(--sign); border-color: var(--sign-ink); }
    /* One strip of kopitiam floor tile under the sign. */
    .tiles {
      flex: none; height: 8px; background-color: var(--sign);
      background-image: conic-gradient(var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0);
      background-size: 8px 8px;
    }

    /* Conversation */
    .scroller {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: var(--s4) max(var(--s4), env(safe-area-inset-right)) var(--s5) max(var(--s4), env(safe-area-inset-left));
      scroll-behavior: smooth;
    }
    .log { display: flex; flex-direction: column; gap: var(--s3); }
    .msg { display: flex; flex-direction: column; max-width: min(85%, 34rem); }
    .msg-uncle { align-self: flex-start; align-items: flex-start; }
    .msg-you { align-self: flex-end; align-items: flex-end; }
    .who {
      margin: 0 0 var(--s1) var(--s1); font-size: .6875rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--tag);
    }
    .bubble {
      padding: .625rem .875rem; border-radius: var(--r-bubble);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .msg-uncle .bubble {
      background: var(--surface); border: 1px solid var(--line);
      border-top-left-radius: .25rem;
    }
    .msg-you .bubble {
      background: var(--accent); color: var(--accent-ink);
      border-bottom-right-radius: .25rem;
    }
    .note { margin: var(--s1) var(--s1) 0; font-size: .75rem; font-weight: 600; color: var(--danger); }

    /* Thinking */
    .thinking .bubble { display: flex; align-items: center; gap: var(--s3); color: var(--muted); }
    .dots { display: inline-flex; gap: 4px; flex: none; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: currentColor;
      animation: bob 1.2s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bob {
      0%, 60%, 100% { transform: translateY(0); opacity: .45; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    .msg { animation: arrive .18s ease-out; }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }

    /* Error */
    .msg-error .bubble {
      background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--ink);
      border-top-left-radius: .25rem;
      display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s2); align-items: start;
    }
    .msg-error .who { color: var(--danger); }
    .msg-error svg { width: 1.25rem; height: 1.25rem; margin-top: .1rem; color: var(--danger); }
    .retry {
      grid-column: 2; justify-self: start; min-height: 2.75rem; padding: 0 var(--s4);
      background: transparent; color: var(--danger); font-weight: 700;
      border: 1.5px solid var(--danger); border-radius: var(--r-control);
    }
    .retry:hover { background: var(--danger); color: var(--danger-bg); }

    /* Starter prompts (empty state) */
    .starters { margin-top: var(--s5); }
    .starters h2 {
      margin: 0 0 var(--s2); font-size: .8125rem; font-weight: 600; color: var(--muted);
    }
    .starter-grid { display: grid; gap: var(--s2); grid-template-columns: 1fr; }
    @media (min-width: 30rem) { .starter-grid { grid-template-columns: 1fr 1fr; } }
    .starter {
      text-align: left; padding: var(--s3) var(--s4); min-height: 4rem;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 4px solid var(--accent); border-radius: var(--r-control);
      display: flex; flex-direction: column; gap: 2px;
    }
    .starter:hover:not(:disabled) { border-color: var(--accent); }
    .starter .tag {
      font-size: .6875rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--tag);
    }
    .starter .ask { font-weight: 600; }
    .starter .how { font-size: .8125rem; color: var(--muted); }

    /* Composer */
    .composer {
      flex: none; background: var(--surface); border-top: 1px solid var(--line);
      padding: var(--s2) max(var(--s3), env(safe-area-inset-right)) calc(var(--s2) + env(safe-area-inset-bottom)) max(var(--s3), env(safe-area-inset-left));
    }
    .quick {
      display: flex; flex-wrap: wrap; gap: .375rem; padding: 2px 0 var(--s2);
    }
    .quick button {
      flex: none; min-height: 2.25rem; padding: 0 .625rem;
      background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
      font-size: .8125rem; white-space: nowrap;
    }
    .quick button:hover:not(:disabled) { border-color: var(--accent); }
    .quick button:disabled, .starter:disabled { opacity: .5; }
    .row { display: flex; align-items: flex-end; gap: var(--s2); }
    textarea {
      flex: 1; min-width: 0; resize: none; display: block;
      min-height: 2.75rem; max-height: 8rem; padding: .625rem .875rem;
      font-size: 1rem; line-height: 1.4;
      background: var(--bg); border: 1px solid var(--muted); border-radius: var(--r-control);
    }
    textarea::placeholder { color: var(--muted); opacity: 1; }
    .send {
      flex: none; width: 2.75rem; height: 2.75rem; padding: 0;
      display: grid; place-items: center;
      background: var(--accent); color: var(--accent-ink);
      border: 0; border-radius: var(--r-control);
    }
    .send svg { width: 1.25rem; height: 1.25rem; }
    .send:disabled { opacity: .5; }
    .hint { display: none; margin: var(--s1) 2px 0; font-size: .75rem; color: var(--muted); }
    @media (hover: hover) and (pointer: fine) { .hint { display: block; } }

    @media (prefers-reduced-motion: reduce) {
      .scroller { scroll-behavior: auto; }
      .msg, .dots i { animation: none; }
      .dots i { opacity: .7; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="sign">
      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
        <circle cx="18" cy="18" r="17" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
        <path d="M11 16h12v3.5a6 6 0 0 1-12 0z" fill="currentColor"/>
        <path d="M23 17h1.5a2.25 2.25 0 0 1 0 4.5H23M9 27.5h16M15 8c-1.6 2 1.6 3 0 5M19.5 8c-1.6 2 1.6 3 0 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="sign-text">
        <h1>Lunch Uncle</h1>
        <p>Near CT Hub 2, Lavender</p>
      </div>
      <button class="reset" id="reset" type="button" hidden>New chat</button>
    </header>
    <div class="tiles" aria-hidden="true"></div>

    <main class="scroller" id="scroller" tabindex="0" aria-label="Conversation with Lunch Uncle">
      <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></div>

      <section class="starters" id="starters" aria-labelledby="starters-title">
        <h2 id="starters-title">Don't know what to ask? Pick one.</h2>
        <div class="starter-grid">
          <button class="starter" type="button" data-send="Something cheap and fast for lunch.">
            <span class="tag">Food</span>
            <span class="ask">Something cheap and fast</span>
            <span class="how">Uncle picks one or two places within walking distance</span>
          </button>
          <button class="starter" type="button" data-send="What is open right now near here?">
            <span class="tag">Open now</span>
            <span class="ask">What is open right now?</span>
            <span class="how">Uncle checks which places are open before he answers</span>
          </button>
          <button class="starter" type="button" data-send="Will it rain soon? Can I walk to lunch?">
            <span class="tag">Rain</span>
            <span class="ask">Will it rain? Can I walk?</span>
            <span class="how">Uncle checks the two-hour forecast for the area</span>
          </button>
          <button class="starter" type="button" data-fill="When is the next bus at stop ">
            <span class="tag">Bus</span>
            <span class="ask">Next bus at my stop</span>
            <span class="how">You type the 5-digit bus stop code, Uncle checks arrivals</span>
          </button>
        </div>
      </section>
    </main>

    <form class="composer" id="form">
      <div class="quick" id="quick" role="group" aria-label="Quick follow-ups" hidden>
        <button type="button" data-send="Don't want that. Suggest something else.">Something else</button>
        <button type="button" data-send="Only places that are open right now.">Open now</button>
        <button type="button" data-send="Will it rain soon? Can I walk there?">Rain?</button>
        <button type="button" data-fill="When is the next bus at stop ">Bus</button>
      </div>
      <div class="row">
        <label class="sr-only" for="input">Message to Uncle</label>
        <textarea id="input" rows="1" maxlength="500" placeholder="Uncle, where to eat?"
          autocomplete="off" enterkeyhint="send" aria-describedby="hint"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="hint" id="hint">Enter to send. Shift + Enter for a new line.</p>
    </form>

    <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  </div>

  <noscript>
    <p style="padding:1rem">Lunch Uncle needs JavaScript turned on to chat.</p>
  </noscript>

  <script>
    const scroller = document.getElementById("scroller");
    const log = document.getElementById("log");
    const starters = document.getElementById("starters");
    const quick = document.getElementById("quick");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const resetButton = document.getElementById("reset");
    const statusLine = document.getElementById("status");

    const GREETING = "Eh, what you want to eat? Don't waste my time.";
    const STORE_KEY = "lunch-uncle:chat:v1";
    const STORE_TTL_MS = 6 * 60 * 60 * 1000; // yesterday's lunch chat is no use today
    const MAX_HISTORY = 20;                  // messages sent back to /chat as context
    const TIMEOUT_MS = 60000;
    const THINKING_LINES = [
      "Uncle thinking…",
      "Wait ah, Uncle checking…",
      "Good answer cannot rush.",
      "Still checking. Don't go anywhere.",
      "Almost done lah. Bit more patience.",
    ];
    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    // Successful turns only, in the shape the /chat endpoint expects.
    let history = [];
    let pending = null;      // { controller, timers } while a request is in flight
    let errorMsg = null;     // the current error bubble, if any
    let failedMsg = null;    // the user bubble that error belongs to

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Model replies are plain text. The only formatting honoured is **bold**,
    // built from DOM nodes so no model or user text is ever parsed as HTML.
    function renderText(target, text) {
      const parts = String(text).split(/\*\*([^*\n]+)\*\*/);
      parts.forEach((part, i) => {
        if (!part) return;
        target.appendChild(i % 2 ? el("strong", "", part) : document.createTextNode(part));
      });
    }

    function scrollToEnd() {
      scroller.scrollTop = scroller.scrollHeight;
    }

    function addMessage(role, text) {
      const who = role === "user" ? "You" : "Uncle";
      const msg = el("div", `msg ${role === "user" ? "msg-you" : "msg-uncle"}`);
      msg.appendChild(el("span", role === "user" ? "sr-only" : "who", who));
      const bubble = el("div", "bubble");
      renderText(bubble, text);
      msg.appendChild(bubble);
      log.appendChild(msg);
      scrollToEnd();
      return msg;
    }

    function addThinking() {
      // Hidden from assistive tech: the status line announces progress once
      // instead of reading out every rotating line.
      const msg = el("div", "msg msg-uncle thinking");
      msg.setAttribute("aria-hidden", "true");
      msg.appendChild(el("span", "who", "Uncle"));
      const bubble = el("div", "bubble");
      const dots = el("span", "dots");
      dots.append(el("i"), el("i"), el("i"));
      const line = el("span", "", THINKING_LINES[0]);
      bubble.append(dots, line);
      msg.appendChild(bubble);
      log.appendChild(msg);
      scrollToEnd();

      let index = 0;
      const rotate = setInterval(() => {
        // After the list runs out, alternate between the last two lines.
        index = index < THINKING_LINES.length - 1 ? index + 1 : THINKING_LINES.length - 2;
        line.textContent = THINKING_LINES[index];
      }, 3500);
      const reassure = setTimeout(() => {
        statusLine.textContent = "Uncle is still working on it.";
      }, 12000);
      return { msg, stop() { clearInterval(rotate); clearTimeout(reassure); msg.remove(); } };
    }

    function addError(text, message) {
      const msg = el("div", "msg msg-uncle msg-error");
      msg.appendChild(el("span", "who", "Problem"));
      const bubble = el("div", "bubble");
      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("viewBox", "0 0 20 20");
      icon.setAttribute("aria-hidden", "true");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M10 2.5 18.5 17h-17zM10 8v4.5M10 14.6v.4");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "currentColor");
      path.setAttribute("stroke-width", "1.7");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      icon.appendChild(path);
      const retry = el("button", "retry", "Try again");
      retry.type = "button";
      retry.addEventListener("click", () => ask(message, { retry: true }));
      bubble.append(icon, el("span", "", text), retry);
      msg.appendChild(bubble);
      log.appendChild(msg);
      scrollToEnd();
      return msg;
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      document.querySelectorAll("[data-send], [data-fill]").forEach((b) => { b.disabled = busy; });
    }

    function syncChrome() {
      const started = log.children.length > 1;
      starters.hidden = started;
      quick.hidden = !started;
      resetButton.hidden = !started;
    }

    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ at: Date.now(), history }));
      } catch { /* private mode or storage full: the chat still works */ }
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!saved || Date.now() - saved.at > STORE_TTL_MS || !Array.isArray(saved.history)) return [];
        return saved.history.filter((m) =>
          m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string");
      } catch {
        return [];
      }
    }

    async function requestReply(message, signal) {
      if (navigator.onLine === false) throw new Error("You are offline. Check your connection, then try again.");
      let res;
      try {
        res = await fetch("/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ history: history.slice(-MAX_HISTORY), message }),
          signal,
        });
      } catch (err) {
        if (err.name === "AbortError") throw err;
        throw new Error("Cannot reach Uncle. Check your connection, then try again.");
      }
      let data = null;
      try { data = await res.json(); } catch { /* not JSON: handled below */ }
      if (!res.ok || !data || typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error((data && typeof data.error === "string" && data.error) ||
          "Uncle cannot think right now, try again later.");
      }
      return data.reply;
    }

    async function ask(message, { retry = false } = {}) {
      if (pending) return;

      // Clear any earlier failure. On retry the user's bubble is reused.
      let userMsg = retry ? failedMsg : null;
      if (errorMsg) errorMsg.remove();
      if (userMsg) {
        userMsg.classList.remove("failed");
        userMsg.querySelector(".note")?.remove();
      }
      errorMsg = failedMsg = null;
      if (!userMsg) userMsg = addMessage("user", message);

      const controller = new AbortController();
      let timedOut = false;
      const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, TIMEOUT_MS);
      const thinking = addThinking();
      pending = { controller };
      setBusy(true);
      syncChrome();
      statusLine.textContent = "Uncle is thinking.";

      try {
        const reply = await requestReply(message, controller.signal);
        thinking.stop();
        history.push({ role: "user", content: message }, { role: "assistant", content: reply });
        save();
        addMessage("assistant", reply);
        statusLine.textContent = "";
      } catch (err) {
        thinking.stop();
        if (err.name === "AbortError" && !timedOut) return; // chat was cleared mid-request
        const text = timedOut ? "Uncle is taking too long. Try again." : err.message;
        userMsg.classList.add("failed");
        userMsg.appendChild(el("span", "note", "Not delivered"));
        failedMsg = userMsg;
        errorMsg = addError(text, message);
        statusLine.textContent = "";
      } finally {
        clearTimeout(timeout);
        if (pending && pending.controller === controller) {
          pending = null;
          setBusy(false);
          if (finePointer) input.focus();
        }
      }
    }

    function resize() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight + 2}px`;
    }

    function submit() {
      const message = input.value.trim();
      if (!message) { input.focus(); return; }
      if (pending) return;
      input.value = "";
      resize();
      ask(message);
    }

    form.addEventListener("submit", (event) => { event.preventDefault(); submit(); });
    input.addEventListener("input", resize);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        submit();
      }
    });

    // Starter cards and quick follow-ups: send straight away, or prefill when
    // the user still has to add something (the bus stop code).
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-send], [data-fill]");
      if (!button || button.disabled) return;
      if (button.dataset.send) {
        ask(button.dataset.send);
      } else {
        input.value = button.dataset.fill;
        resize();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        statusLine.textContent = "Type your five-digit bus stop code, then send.";
      }
    });

    // New chat asks once before throwing the conversation away.
    let confirmTimer = null;
    function disarmReset() {
      clearTimeout(confirmTimer);
      resetButton.classList.remove("confirm");
      resetButton.textContent = "New chat";
    }
    resetButton.addEventListener("click", () => {
      if (!resetButton.classList.contains("confirm")) {
        resetButton.classList.add("confirm");
        resetButton.textContent = "Clear chat?";
        confirmTimer = setTimeout(disarmReset, 4000);
        return;
      }
      disarmReset();
      if (pending) { pending.controller.abort(); pending = null; }
      history = [];
      errorMsg = failedMsg = null;
      try { localStorage.removeItem(STORE_KEY); } catch { /* nothing stored */ }
      log.replaceChildren();
      addMessage("assistant", GREETING);
      setBusy(false);
      syncChrome();
      scroller.scrollTop = 0;
      statusLine.textContent = "Chat cleared.";
      input.focus();
    });
    resetButton.addEventListener("blur", disarmReset);

    // Keep the composer above the on-screen keyboard where the browser does not
    // resize the layout itself. Skipped while pinch-zoomed so zooming still works.
    if (window.visualViewport) {
      const fit = () => {
        if (Math.abs(visualViewport.scale - 1) > 0.01) return;
        document.documentElement.style.setProperty("--app-h", `${visualViewport.height}px`);
        window.scrollTo(0, 0);
        scrollToEnd();
      };
      visualViewport.addEventListener("resize", fit);
    }

    addMessage("assistant", GREETING);
    history = restore();
    history.forEach((m) => addMessage(m.role, m.content));
    syncChrome();
    // A restored chat opens at the latest message; a fresh one at the greeting.
    scroller.style.scrollBehavior = "auto";
    scroller.scrollTop = history.length ? scroller.scrollHeight : 0;
    scroller.style.scrollBehavior = "";
    if (finePointer) input.focus();
  </script>
</body>
</html>
